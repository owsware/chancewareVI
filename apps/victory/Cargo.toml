[package]
name = "victory"
default-run = "chanceware"
autobins = false
description = "Chanceware command-line runtime for Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chanceware"
path = "src/main.rs"

[[bin]]
name = "chanceware-play"
path = "src/bin/victory-play.rs"

[[bin]]
name = "chanceware-warm"
path = "src/bin/victory-warm.rs"

[dependencies]
victory-core.workspace = true
victory-pe.workspace = true
victory-loader.workspace = true
victory-hle.workspace = true
victory-shader = { workspace = true, features = ["host"] }
victory-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true
tracing.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "victory-core/diagnostics",
    "victory-hle/diagnostics",
    "victory-loader/diagnostics",
    "victory-shader/diagnostics",
]

[lints]
workspace = true
